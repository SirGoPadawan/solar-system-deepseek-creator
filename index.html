<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Солнечная система — Three.js</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #eaf2ff;
      }
      canvas {
        display: block;
      }

      /* ─── [FEATURE:UI] панель скорости ─── */
      .hud {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 14px;
        background: rgba(14, 20, 34, 0.62);
        border: 1px solid rgba(120, 170, 255, 0.25);
        backdrop-filter: blur(8px);
        z-index: 10;
        user-select: none;
      }
      .hud button {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid rgba(120, 170, 255, 0.3);
        background: rgba(30, 44, 70, 0.7);
        color: #eaf2ff;
        font-size: 18px;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .hud button:hover {
        background: rgba(60, 90, 140, 0.85);
      }
      .hud button:active {
        transform: scale(0.94);
      }
      .hud button.active {
        background: rgba(90, 169, 255, 0.55);
      }
      .hud-speed {
        min-width: 48px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        font-size: 15px;
        color: #bcd6ff;
      }

      /* ─── [FEATURE:UI] меню планеты ─── */
      .panel {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 280px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(14, 20, 34, 0.72);
        border: 1px solid rgba(120, 170, 255, 0.28);
        backdrop-filter: blur(10px);
        z-index: 11;
        transition: opacity 0.18s, transform 0.18s;
      }
      .panel.hidden {
        opacity: 0;
        transform: translateX(16px);
        pointer-events: none;
      }
      .panel h2 {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .panel .row {
        display: block;
        font-size: 13px;
        color: #a9c1e6;
        margin-bottom: 12px;
      }
      .panel .row b {
        float: right;
        color: #eaf2ff;
        font-variant-numeric: tabular-nums;
      }
      .panel input[type='range'] {
        width: 100%;
        margin-top: 6px;
        accent-color: #5aa9ff;
      }
      .panel .row.disabled {
        opacity: 0.4;
      }
      .panel-close {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #eaf2ff;
        font-size: 16px;
        cursor: pointer;
      }
      .panel-close:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .panel-reset {
        width: 100%;
        margin-top: 4px;
        padding: 9px;
        border-radius: 10px;
        border: 1px solid rgba(120, 170, 255, 0.3);
        background: rgba(30, 44, 70, 0.7);
        color: #eaf2ff;
        cursor: pointer;
        font-size: 13px;
      }
      .panel-reset:hover {
        background: rgba(60, 90, 140, 0.85);
      }

      .hint {
        position: fixed;
        top: 16px;
        left: 16px;
        font-size: 12px;
        line-height: 1.5;
        color: #8ea6c9;
        z-index: 10;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
      }
    </style>
    <!-- Карта импортов указывает на локальные файлы в vendor/ (не зависит от node_modules) -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div class="hint">
      ЛКМ — вращать · колесо — зум<br />
      клик по планете — её параметры
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
