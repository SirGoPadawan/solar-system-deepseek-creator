<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Солнечная система — Three.js</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #eaf2ff;
      }
      canvas {
        display: block;
      }

      /* ─── [FEATURE:UI] затемнение по краям кадра («больше темноты») ─── */
      .vignette {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 50% 45%,
            rgba(0, 0, 0, 0) 32%,
            rgba(0, 0, 0, 0.42) 72%,
            rgba(0, 0, 0, 0.72) 100%
          );
      }

      /* ─── [FEATURE:UI] панель управления слева вверху ─── */
      .controls {
        position: fixed;
        top: 14px;
        left: 14px;
        width: 300px;
        max-height: calc(100vh - 28px);
        display: flex;
        flex-direction: column;
        border-radius: 16px;
        background: rgba(10, 14, 24, 0.74);
        border: 1px solid rgba(120, 170, 255, 0.22);
        backdrop-filter: blur(10px);
        z-index: 10;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
        user-select: none;
      }
      .ctl-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(120, 170, 255, 0.16);
        flex: 0 0 auto;
      }
      .ctl-brand {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: #cfe1ff;
      }
      .ctl-collapse {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #eaf2ff;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }
      .ctl-collapse:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .ctl-body {
        padding: 6px 14px 12px;
        overflow-y: auto;
      }
      .controls.collapsed .ctl-body {
        display: none;
      }
      .ctl-body::-webkit-scrollbar {
        width: 8px;
      }
      .ctl-body::-webkit-scrollbar-thumb {
        background: rgba(120, 170, 255, 0.25);
        border-radius: 8px;
      }

      .ctl-block {
        padding: 10px 0;
        border-bottom: 1px solid rgba(120, 170, 255, 0.1);
      }
      .ctl-block:last-of-type {
        border-bottom: none;
      }
      .ctl-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7e9bc4;
        margin-bottom: 8px;
      }
      .ctl-note {
        font-size: 10px;
        text-transform: none;
        letter-spacing: 0;
        color: #5f769b;
      }

      .speed-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .speed-row button {
        width: 38px;
        height: 34px;
        border-radius: 9px;
        border: 1px solid rgba(120, 170, 255, 0.28);
        background: rgba(30, 44, 70, 0.7);
        color: #eaf2ff;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.15s, transform 0.08s;
      }
      .speed-row button:hover {
        background: rgba(60, 90, 140, 0.9);
      }
      .speed-row button:active {
        transform: scale(0.94);
      }
      .speed-row button.active {
        background: rgba(90, 169, 255, 0.6);
      }
      .speed-val {
        min-width: 46px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        color: #bcd6ff;
      }

      .chk {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #cfdcf0;
        padding: 4px 0;
        cursor: pointer;
      }
      .chk input {
        accent-color: #5aa9ff;
        width: 15px;
        height: 15px;
        cursor: pointer;
      }
      .planet-name {
        cursor: pointer;
      }
      .planet-name:hover {
        color: #7fb6ff;
        text-decoration: underline;
      }

      .params {
        background: rgba(30, 60, 110, 0.22);
        border-radius: 12px;
        padding: 10px 12px;
        border: 1px solid rgba(120, 170, 255, 0.18);
      }
      .params.hidden {
        display: none;
      }
      .ctl-x {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #eaf2ff;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }
      .ctl-x:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .params .row {
        display: block;
        font-size: 12px;
        color: #a9c1e6;
        margin-bottom: 10px;
      }
      .params .row b {
        float: right;
        color: #eaf2ff;
        font-variant-numeric: tabular-nums;
      }
      .params input[type='range'] {
        width: 100%;
        margin-top: 5px;
        accent-color: #5aa9ff;
      }
      .params .row.disabled {
        opacity: 0.4;
      }
      .ctl-btn {
        width: 100%;
        padding: 8px;
        border-radius: 9px;
        border: 1px solid rgba(120, 170, 255, 0.3);
        background: rgba(30, 44, 70, 0.7);
        color: #eaf2ff;
        cursor: pointer;
        font-size: 12px;
      }
      .ctl-btn:hover {
        background: rgba(60, 90, 140, 0.9);
      }

      .ctl-hint {
        margin-top: 10px;
        font-size: 11px;
        line-height: 1.5;
        color: #6d84a8;
      }
    </style>
    <!-- Карта импортов указывает на локальные файлы в vendor/ (не зависит от node_modules) -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div class="vignette"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
